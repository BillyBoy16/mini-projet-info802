<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Projet INFO802</title>
    
    <link rel="stylesheet" href="../static/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
        <div id="loaderMessage" class="loader-text">Chargement en cours...</div>
    </div>
    <header>
        <h1>MINI PROJET INFO 802</h1>
    </header>

    <main>

        <div class="car-selection">
            <h3>Choisissez votre véhicule</h3>
            <select id="carSelect" onchange="updateCarDetails()">
                <option value="">-- Chargement des voitures... --</option>
            </select>

            <div id="carPreview" class="car-details">
                <img id="carImage" src="" alt="Voiture">
                <div class="car-info-text" id="carData"></div>
            </div>
        </div>

        <div class="controls">
            <div class="input-group">
                <label for="depart">Ville de départ</label>
                <input type="text" id="depart" placeholder="Ex: Paris" value="Paris">
            </div>
            
            <div class="input-group">
                <label for="arrivee">Ville de destination</label>
                <input type="text" id="arrivee" placeholder="Ex: Lyon" value="Lyon">
            </div>

            <button id="btnCalculer" onclick="lancerTraitement()">Calculer</button>
        </div>

        <div class="input-group">
            <label for="autonomie">Autonomie (km)</label>
            <input type="number" id="autonomie" value="300">
        </div>

        <div id="resultat"></div>
        <div id="map"></div>
    </main>

    <footer>
        Lenny Loy
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../static/script.js"></script>
</body>
</html>
